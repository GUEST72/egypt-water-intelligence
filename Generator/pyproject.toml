[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egypt-water-intelligence"
version = "0.1.0"
description = "Local synthetic, EPANET-backed water-utility data generator"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22,<5",
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "wntr>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
kafka = ["kafka-python-ng>=2.2,<3"]
minio = ["minio>=7.2,<8"]

[project.scripts]
water-generator = "egypt_water_intelligence.generator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
