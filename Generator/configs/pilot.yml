  - scenario_id: burst-d4
    type: burst
    district_id: D004
    start_minute: 21600
    end_minute: 21720
    emitter_coefficient: 0.0001
sensor:
  noise_relative_stddev: 0.0

faults:
  - stream: meter
    type: null_value
    every_n: 25000
    field: consumed_volume_m3

  - stream: district
    type: null_value
    every_n: 5000
    field: pressure_m_h2o

  - stream: meter
    type: duplicate
    every_n: 25000  
